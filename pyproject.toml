[project]
name = "gaze-pane"
version = "0.1.0"
description = "Auto-select the iTerm2 pane you're looking at, via webcam gaze tracking."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Noah Johnson" }]
dependencies = [
    "mediapipe>=0.10.21,<0.11",
    "opencv-python>=4.10",
    "numpy>=1.26,<3",
    "iterm2>=2.7",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-AVFoundation>=10",
    "mlx-whisper>=0.4",
    "silero-vad>=5",
    "sounddevice>=0.5",
]

[project.scripts]
gaze-pane = "gaze_pane.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaze_pane*"]
